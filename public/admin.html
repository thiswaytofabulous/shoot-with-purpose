<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shoot With Purpose · Archive</title>
<meta name="robots" content="noindex, nofollow" />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{--pink:#FF0091;--rose:#9C5F66;--navy:#2E4968;--blush:#F8E6E5;--warm:#F3F1F0;--white:#fff;--soft:#5b6878;--line:rgba(46,73,104,.14)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Montserrat',Helvetica,Arial,sans-serif;background:var(--warm);color:var(--navy);padding:32px 16px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:820px;margin:0 auto}
  h1{font-size:22px;font-weight:900;text-transform:uppercase;letter-spacing:.02em}
  .sub{font-size:13px;color:var(--soft);font-weight:500;margin:4px 0 24px}
  .gate,.detail{background:var(--white);border-radius:16px;padding:28px}
  .gate{max-width:420px}
  label{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:8px}
  input,select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:14px;color:var(--navy);outline:none;margin-bottom:14px;background:#fff}
  .btn{background:var(--navy);color:#fff;border:0;border-radius:12px;padding:12px 20px;font:inherit;font-weight:800;font-size:13px;cursor:pointer}
  .err{color:#b0003a;font-size:12px;font-weight:700;margin-top:10px;min-height:16px}
  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .filters select{width:auto;margin:0}
  .list{display:flex;flex-direction:column;gap:10px}
  .row{background:#fff;border-radius:14px;padding:14px 18px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid transparent;text-align:left;font:inherit;color:inherit;width:100%}
  .row:hover,.row:focus-visible{border-color:var(--line);outline:none}
  .row .label{font-weight:700;font-size:14px}
  .row .meta{font-size:11.5px;color:var(--soft);font-weight:600;margin-top:2px}
  .tags{display:flex;gap:6px;flex-shrink:0;align-items:center}
  .tag{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;border-radius:99px;background:var(--warm)}
  .tag.done{background:#E3EFE7;color:#2f6b47}
  .tag.prog{background:#FFF4D6;color:#7a5a00}
  .tag.twtf{background:var(--blush);color:#a3005e}
  .empty{font-size:14px;color:var(--soft);padding:20px}
  .back{background:none;border:0;color:var(--navy);font:inherit;font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;margin-bottom:18px;text-decoration:underline}
  .dmeta{font-size:12.5px;color:var(--soft);font-weight:600;line-height:1.6;margin-bottom:8px}
  .sec{display:block;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--rose);margin:24px 0 12px}
  .brief p{margin:0 0 14px;font-size:14px;line-height:1.6;font-weight:500;white-space:pre-wrap}
  .brief strong{color:var(--rose)}
  .b-row{margin:0 0 12px}
  .b-who{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
  .bubble{display:inline-block;max-width:84%;padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.5;white-space:pre-wrap;text-align:left;overflow-wrap:anywhere}
  .bstatus{font-size:13px;font-weight:600;line-height:1.5;padding:12px 14px;border-radius:12px;margin:0 0 14px;background:#E3EFE7;color:#2f6b47}
  .bstatus.bad{background:#F8E3E3;color:#8a2a2a}
  .resend{background:var(--navy);color:#fff;border:0;border-radius:99px;font:inherit;font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:9px 16px;cursor:pointer;margin:0 0 18px}
  .resend:disabled{opacity:.5;cursor:default}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>Shoot With Purpose</h1>
  <div class="sub">Every pre-shoot conversation, in progress and finished.</div>

  <div class="gate" id="gate">
    <label for="tokenInput">Access code</label>
    <input type="password" id="tokenInput" placeholder="Paste your ADMIN_TOKEN" autocomplete="off" />
    <button class="btn" id="unlockBtn" type="button">Unlock</button>
    <div class="err" id="gateErr" role="status"></div>
  </div>

  <div id="listWrap" hidden>
    <div class="filters">
      <select id="fStatus" aria-label="Filter by status"><option value="">All statuses</option><option value="done">Finished</option><option value="prog">In progress</option></select>
      <select id="fBrand" aria-label="Filter by brand"><option value="">Both brands</option><option value="hbm">HBM</option><option value="twtf">TWTF</option></select>
    </div>
    <div class="list" id="list"></div>
  </div>

  <div class="detail" id="detail" hidden>
    <button class="back" id="backBtn" type="button">&larr; All conversations</button>
    <div class="dmeta" id="dmeta"></div>
    <span class="sec">Strategy brief</span>
    <div class="bstatus" id="dbstatus" role="status" hidden></div>
    <button class="resend" id="resendBtn" type="button" hidden>Send brief now</button>
    <div class="brief" id="dbrief"></div>
    <span class="sec">Full conversation</span>
    <div id="dconvo"></div>
  </div>
</div>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var token = "", all = [], current = null;
  var esc = function(s){ var d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; };
  var fmt = function(iso){ try { return new Date(iso).toLocaleString(undefined, { dateStyle:"medium", timeStyle:"short" }); } catch(e){ return iso || ""; } };
  var PH = { change:"What's changing", goal:"The goal", gaps:"Gaps + destinations", people:"People + camera", wrap:"Wrapping up" };

  function renderList(){
    var st = $("fStatus").value, br = $("fBrand").value;
    var items = all.filter(function(i){ return (!st || (st === "done") === i.complete) && (!br || i.brand === br); });
    var list = $("list"); list.textContent = "";
    if (!items.length){ list.innerHTML = '<div class="empty">Nothing here yet.</div>'; return; }
    items.forEach(function(i){
      var b = document.createElement("button"); b.type = "button"; b.className = "row";
      b.innerHTML = '<div><div class="label">' + esc(i.name) + (i.business ? " · " + esc(i.business) : "") + '</div>'
        + '<div class="meta">' + esc(i.email) + " · " + fmt(i.updatedAt) + (i.complete ? "" : " · " + esc(PH[i.phase] || "") + " · " + i.turns + " replies") + '</div></div>'
        + '<div class="tags"><span class="tag ' + (i.brand === "twtf" ? "twtf" : "") + '">' + (i.brand === "twtf" ? "TWTF" : "HBM") + '</span>'
        + '<span class="tag ' + (i.complete ? "done" : "prog") + '">' + (i.complete ? "Finished" : "In progress") + '</span></div>';
      b.addEventListener("click", function(){ openDetail(i.id); });
      list.appendChild(b);
    });
  }

  async function loadList(){
    $("gateErr").textContent = "";
    try{
      var res = await fetch("/.netlify/functions/admin-intakes?token=" + encodeURIComponent(token));
      if (res.status === 401){ $("gateErr").textContent = "That code didn't work."; return false; }
      if (!res.ok){ $("gateErr").textContent = "Something went wrong loading the archive."; return false; }
      all = (await res.json()).intakes || [];
      renderList();
      $("gate").hidden = true; $("listWrap").hidden = false;
      try { localStorage.setItem("swp_admin_token", token); } catch(e){}
      return true;
    }catch(e){ $("gateErr").textContent = "Couldn't reach the server."; return false; }
  }

  async function openDetail(id){
    var res = await fetch("/.netlify/functions/admin-intakes?token=" + encodeURIComponent(token) + "&id=" + encodeURIComponent(id));
    if (!res.ok) return;
    var r = await res.json();
    current = r.id;
    var st = $("dbstatus");
    st.hidden = !r.complete;
    st.className = "bstatus" + (r.briefError ? " bad" : "");
    st.textContent = r.briefError ? r.briefError
      : r.briefSentAt ? "Brief emailed to you " + fmt(r.briefSentAt) + "."
      : "The brief hasn't been emailed yet.";
    $("resendBtn").hidden = !r.complete;
    $("resendBtn").textContent = r.briefSentAt ? "Resend brief" : "Send brief now";
    $("dmeta").innerHTML = "<strong>" + esc(r.name) + (r.business ? " · " + esc(r.business) : "") + "</strong><br/>"
      + esc(r.email) + " · " + esc(r.brand) + (r.shoot ? " · " + esc(r.shoot) : "") + "<br/>"
      + (r.complete ? "Finished " + fmt(r.completedAt) : "In progress · last active " + fmt(r.updatedAt));
    $("dbrief").innerHTML = r.brief
      ? r.brief.split(/\n\s*\n/).filter(function(p){ return p.trim(); }).map(function(p){ return "<p>" + esc(p).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>") + "</p>"; }).join("")
      : '<p class="empty">' + (r.complete ? "The brief is still generating. Refresh in a minute." : "The brief is written when they finish the conversation.") + "</p>";
    $("dconvo").innerHTML = r.messages.map(function(m){
      var c = m.who === "client";
      return '<div class="b-row" style="text-align:' + (c ? "right" : "left") + '"><div class="b-who" style="color:' + (c ? "#5b6878" : "#9C5F66") + '">' + (c ? esc(r.name) : "Jessi") + '</div>'
        + '<div class="bubble" style="background:' + (c ? "#2E4968" : "#F3F1F0") + ";color:" + (c ? "#fff" : "#2E4968") + '">' + esc(m.text) + "</div></div>";
    }).join("");
    $("listWrap").hidden = true; $("detail").hidden = false; window.scrollTo(0, 0);
  }

  $("resendBtn").addEventListener("click", async function(){
    var btn = this, st = $("dbstatus");
    btn.disabled = true; st.hidden = false; st.className = "bstatus"; st.textContent = "Writing and sending the brief. This takes about a minute…";
    try{
      var res = await fetch("/.netlify/functions/admin-intakes?token=" + encodeURIComponent(token) + "&id=" + encodeURIComponent(current), { method:"POST" });
      var data = await res.json().catch(function(){ return {}; });
      if (!res.ok){ st.className = "bstatus bad"; st.textContent = data.error || "Something went wrong."; btn.disabled = false; return; }
      setTimeout(function(){ btn.disabled = false; openDetail(current); }, 60000);
    }catch(e){ st.className = "bstatus bad"; st.textContent = "Couldn't reach the server."; btn.disabled = false; }
  });
  $("backBtn").addEventListener("click", function(){ $("detail").hidden = true; $("listWrap").hidden = false; });
  $("unlockBtn").addEventListener("click", function(){ token = $("tokenInput").value.trim(); if (!token){ $("gateErr").textContent = "Enter your access code."; return; } loadList(); });
  $("tokenInput").addEventListener("keydown", function(e){ if (e.key === "Enter") $("unlockBtn").click(); });
  $("fStatus").addEventListener("change", renderList);
  $("fBrand").addEventListener("change", renderList);
  var saved = null; try { saved = localStorage.getItem("swp_admin_token"); } catch(e){}
  if (saved){ token = saved; loadList().then(function(ok){ if (!ok){ try { localStorage.removeItem("swp_admin_token"); } catch(e){} token = ""; } }); }
})();
</script>
</body>
</html>
